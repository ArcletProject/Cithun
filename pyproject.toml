[project]
name = "arclet-cithun"
version = "1.3.2"
description = "A permission system modeled on the file permission system under Unix."
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]

[tool.pdm.build]
includes = ["src/"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
disableBytesTypePromotions = true

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["src/**.py"]
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["C901", "C408", "T201", "E731", "E402", "PYI055"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
extra-standard-library = ["typing_extensions"]

[tool.pdm.scripts]
format = { composite = ["ruff check --select I --fix ./src/","black ./src/","ruff check ./src/"] }

[dependency-groups]
dev = [
    "black>=26.5.0",
    "ruff>=0.15.13",
]
